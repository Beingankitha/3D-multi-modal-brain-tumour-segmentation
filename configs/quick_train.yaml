# Quick training configuration for testing on small dataset/fast iteration
# Inherits from default_config.yaml and overrides specific values

defaults:
  - default_config

# Smaller model for faster training
model:
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]

# Smaller spatial size
transforms:
  spatial_size: [96, 96, 96]

# Faster training settings
training:
  batch_size: 1
  num_epochs: 50
  val_interval: 5
  save_interval: 10
  
  scheduler:
    warmup_epochs: 5
  
  early_stopping:
    patience: 20

# Use fewer workers
data:
  num_workers: 2
